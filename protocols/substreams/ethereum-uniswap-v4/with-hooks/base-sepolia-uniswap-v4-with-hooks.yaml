specVersion: v0.1.0
package:
  name: "base_sepolia_uniswap_v4_with_hooks"
  version: v0.8.0
  url: "https://github.com/propeller-heads/tycho-indexer/tree/main/protocols/substreams/ethereum-uniswap-v4/with-hooks"

# NOTE: NFTX is currently deployed only on Base Sepolia (84532), which Tycho does
# not yet support as a chain (no Chain::BaseSepolia, no harness endpoint). This
# manifest is ready for when Base Sepolia support lands (or NFTX deploys to Base
# mainnet, in which case point map_pools_created at the mainnet PoolManager and add
# the NFTX enrichment to the Base mainnet manifest instead).

protobuf:
  files:
    - tycho/evm/v1/entity.proto
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/utils.proto
    - uniswap.proto
  importPaths:
    - ../../../../proto
    - ../shared/proto
  excludePaths:
    - sf/substreams
    - google
    - tycho

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/ethereum_uniswap_v4_with_hooks.wasm

modules:
  - name: map_pools_created
    kind: map
    initialBlock: 42616213
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.v1.BlockEntityChanges

  - name: store_pools
    kind: store
    initialBlock: 42616213
    updatePolicy: set_if_not_exists
    valueType: proto:uniswap.v4.Pool
    inputs:
      - map: map_pools_created

  - name: map_events
    kind: map
    initialBlock: 42616213
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_pools
    output:
      type: proto:uniswap.v4.Events

  - name: store_pool_current_tick
    kind: store
    initialBlock: 42616213
    updatePolicy: set
    valueType: int64
    inputs:
      - map: map_events

  - name: store_pool_current_sqrt_price
    kind: store
    initialBlock: 42616213
    updatePolicy: set
    valueType: bigint
    inputs:
      - map: map_events

  - name: map_balance_changes
    kind: map
    initialBlock: 42616213
    inputs:
      - map: map_events
      - store: store_pool_current_sqrt_price
    output:
      type: proto:tycho.evm.v1.BlockBalanceDeltas

  - name: store_pools_balances
    kind: store
    initialBlock: 42616213
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_balance_changes

  - name: map_ticks_changes
    kind: map
    initialBlock: 42616213
    inputs:
      - map: map_events
    output:
      type: proto:uniswap.v4.TickDeltas

  - name: store_ticks_liquidity
    kind: store
    initialBlock: 42616213
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_ticks_changes

  - name: map_liquidity_changes
    kind: map
    initialBlock: 42616213
    inputs:
      - map: map_events
      - store: store_pool_current_tick
    output:
      type: proto:uniswap.v4.LiquidityChanges

  - name: store_liquidity
    kind: store
    initialBlock: 42616213
    updatePolicy: set_sum
    valueType: bigint
    inputs:
      - map: map_liquidity_changes

  - name: map_protocol_changes
    kind: map
    initialBlock: 42616213
    inputs:
      - source: sf.ethereum.type.v2.Block
      - map: map_pools_created
      - map: map_events
      - map: map_balance_changes
      - store: store_pools_balances
        mode: deltas
      - map: map_ticks_changes
      - store: store_ticks_liquidity
        mode: deltas
      - map: map_liquidity_changes
      - store: store_liquidity
        mode: deltas
    output:
      type: proto:tycho.evm.v1.BlockChanges

  - name: map_nftx_enriched_protocol_changes
    kind: map
    initialBlock: 42616213
    inputs:
      - params: string
      - map: map_protocol_changes
    output:
      type: proto:tycho.evm.v1.BlockChanges

params:
  # Base Sepolia Uniswap V4 PoolManager.
  map_pools_created: "05e73354cfdd6745c338b50bcfdfa3aa6fa03408"
  # NFTXV4Hook (Base Sepolia).
  map_nftx_enriched_protocol_changes: "32d550542268d22ee1fd35d392780f4c729a2fcc"
